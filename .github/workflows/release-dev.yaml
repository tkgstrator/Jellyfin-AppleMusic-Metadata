name: Release (development)

# Every merge into develop publishes a pre-release under the rolling `dev` tag.
on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yaml

  release:
    name: Publish development build
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Resolve version
        id: version
        run: |
          # 0.1.0.0 in Directory.Build.props -> 0.1.0.<run number>
          base="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)"
          version="$(echo "$base" | cut -d. -f1-3).${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Development version: $version"

      - name: Build packages
        env:
          CHANGELOG: Development build ${{ steps.version.outputs.version }} from ${{ github.sha }}
        run: ./scripts/package.sh "${{ steps.version.outputs.version }}"

      # Replace the previous dev release so stale archives do not pile up.
      - name: Drop previous development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete dev --yes --cleanup-tag || true

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          target_commitish: ${{ github.sha }}
          name: Development build ${{ steps.version.outputs.version }}
          body: |
            Automated build from `develop` (${{ github.sha }}).

            **This is a development build.** Pick the archive matching your server:

            | Jellyfin | Archive |
            | --- | --- |
            | 12.0.x | `apple-music_${{ steps.version.outputs.version }}_jellyfin-12.0.zip` |
            | 10.11.x | `apple-music_${{ steps.version.outputs.version }}_jellyfin-10.11.zip` |
          prerelease: true
          make_latest: false
          files: |
            dist/*.zip
            dist/*.md5
