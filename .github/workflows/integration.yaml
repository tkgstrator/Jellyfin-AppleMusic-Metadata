name: Integration

# Feature branches and pull requests.
# Also called by deployment.yaml so that every release goes through the exact
# same checks — keep new checks in this file only.
on:
  push:
    branches-ignore:
      - master
      - develop
  pull_request:
  workflow_call:
    inputs:
      ci-force-heavy:
        description: Run full validation when called by another workflow.
        type: boolean
        default: true
        required: false
      lint-commits:
        description: Run commitlint. Disabled when called from deployment.yaml, since merge commits are not Conventional Commits.
        type: boolean
        default: true

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci-change-scope:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-change-scope.yaml
    with:
      doc-paths: '["AGENTS.md","CLAUDE.md","LICENSE","README.md","docs/backend.md","docs/development.md","docs/development/ci-change-scope.md","docs/research/webplay-token.md"]'
      doc-prefixes: '[]'
      runner: '"ubuntu-latest"'
      force-heavy: ${{ inputs['ci-force-heavy'] == true }}

  commitlint:
    name: Commit Lint
    if: ${{ inputs.lint-commits != false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install commitlint
        run: |
          bun install conventional-changelog-conventionalcommits
          bun install @commitlint/config-conventional@latest
          bun install commitlint@latest
      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: |
          bunx commitlint \
            --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose
      - name: Validate last commit
        if: github.event_name == 'push'
        run: bunx commitlint --last --verbose

  actionlint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  lint:
    name: Lint (dotnet format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore
      - name: Verify formatting
        run: dotnet format --no-restore --verify-no-changes --verbosity diagnostic

  build:
    if: ${{ !cancelled() && (true) }}
    needs: ["ci-change-scope"]
    name: Build (${{ matrix.tfm }} / Jellyfin ${{ matrix.jellyfin }})
    runs-on: ${{ fromJSON((needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true') && '"ubuntu-latest"' || '"ubuntu-latest"') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tfm: net9.0
            jellyfin: '10.11'
          - tfm: net10.0
            jellyfin: '12.0'
    steps:
      - uses: actions/checkout@v5
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
      - uses: actions/setup-dotnet@v4
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - uses: actions/cache@v4
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        run: dotnet restore
      # Analyzers run here: the project sets TreatWarningsAsErrors, so any
      # StyleCop / .NET analyzer violation fails this job.
      - name: Build
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        run: >-
          dotnet build --no-restore --configuration Release
          --framework ${{ matrix.tfm }}
          Jellyfin.Plugin.AppleMusic/Jellyfin.Plugin.AppleMusic.csproj

      - name: Docs-only exemption
        if: ${{ needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true' }}
        shell: bash
        working-directory: .
        env:
          CI_CHANGE_REASON: ${{ needs['ci-change-scope'].outputs.reason }}
        run: |
          printf '%s\n' "$CI_CHANGE_REASON" >> "$GITHUB_STEP_SUMMARY"
  test:
    if: ${{ !cancelled() && (true) }}
    needs: ["ci-change-scope"]
    name: Test
    runs-on: ${{ fromJSON((needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true') && '"ubuntu-latest"' || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v5
      # Both runtimes are required: tests target net9.0 and net10.0, and
      # Jellyfin.Controller pulls in ASP.NET Core.
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
      - uses: actions/setup-dotnet@v4
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - uses: actions/cache@v4
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        run: dotnet restore
      - name: Test
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        run: dotnet test --no-restore --configuration Release

      - name: Docs-only exemption
        if: ${{ needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true' }}
        shell: bash
        working-directory: .
        env:
          CI_CHANGE_REASON: ${{ needs['ci-change-scope'].outputs.reason }}
        run: |
          printf '%s\n' "$CI_CHANGE_REASON" >> "$GITHUB_STEP_SUMMARY"
