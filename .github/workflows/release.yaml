name: Release

# Stable release: push a v* tag (e.g. v0.2.0).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Four-part version to build (e.g. 0.2.0.0)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yaml

  release:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            # v1.2.3 -> 1.2.3.0 (Jellyfin requires a four-part version)
            version="${GITHUB_REF_NAME#v}"
            while [ "$(echo "$version" | tr -cd '.' | wc -c)" -lt 3 ]; do
              version="$version.0"
            done
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Build packages
        env:
          CHANGELOG: Release ${{ steps.version.outputs.version }}
        run: ./scripts/package.sh "${{ steps.version.outputs.version }}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.md5
